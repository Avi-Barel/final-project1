name: Deploy Voting App

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Init (backend=false)
        run: terraform init -backend=false
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

  build:
    name: Build & Push Images
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Service Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          PREFIX: ${{ vars.NAME_PREFIX }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          for SERVICE in vote result worker; do
            REPO="${PREFIX}-${SERVICE}"
            IMAGE="${REGISTRY}/${REPO}:${TAG}"
            echo "Checking if tag ${TAG} already exists in ${REPO}..."
            TAG_EXISTS=$(aws ecr describe-images --repository-name "${REPO}" --image-ids imageTag="${TAG}" --region eu-north-1 2>/dev/null || true)
            
            if [ -n "$TAG_EXISTS" ]; then
              echo "Tag ${TAG} already exists in ${REPO}. Skipping build and push."
            else
              echo "Building ${SERVICE} for linux/amd64..."
              docker build --platform linux/amd64 -t "${IMAGE}" "./services/${SERVICE}"
              
              if [ "$IS_MAIN" = "true" ]; then
                echo "Pushing ${IMAGE} to ECR..."
                docker push "${IMAGE}"
              else
                echo "Pull request build: skipping push to ECR."
              fi
            fi
          done

  plan-pr:
    name: Terraform Plan (PR)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev, prod ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=eu-north-1"

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan \
            -var-file="envs/${{ matrix.env }}.tfvars" \
            -var="image_tag=${{ github.sha }}"

  deploy-dev:
    name: Deploy to Dev
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/dev/terraform.tfstate" \
            -backend-config="region=eu-north-1"

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var-file="envs/dev.tfvars" \
            -var="image_tag=${{ github.sha }}"

      - name: Smoke Tests (Dev)
        working-directory: infra
        run: |
          VOTE_URL=$(terraform output -raw vote_url)
          RESULT_URL=$(terraform output -raw result_url)
          echo "Testing Dev Vote URL: ${VOTE_URL}/healthz"
          echo "Testing Dev Result URL: ${RESULT_URL}/healthz"
          
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${VOTE_URL}/healthz"
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${RESULT_URL}/healthz"

      - name: Version Check & Steady State (Dev)
        working-directory: infra
        run: |
          terraform plan -detailed-exitcode \
            -var-file="envs/dev.tfvars" \
            -var="image_tag=${{ github.sha }}"

  deploy-prod:
    name: Deploy to Prod
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/prod/terraform.tfstate" \
            -backend-config="region=eu-north-1"

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var-file="envs/prod.tfvars" \
            -var="image_tag=${{ github.sha }}"

      - name: Smoke Tests (Prod)
        working-directory: infra
        run: |
          VOTE_URL=$(terraform output -raw vote_url)
          RESULT_URL=$(terraform output -raw result_url)
          echo "Testing Prod Vote URL: ${VOTE_URL}/healthz"
          echo "Testing Prod Result URL: ${RESULT_URL}/healthz"
          
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${VOTE_URL}/healthz"
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${RESULT_URL}/healthz"

      - name: Version Check & Steady State (Prod)
        working-directory: infra
        run: |
          terraform plan -detailed-exitcode \
            -var-file="envs/prod.tfvars" \
            -var="image_tag=${{ github.sha }}"
